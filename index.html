  <body class="bg-[#FFFFFF] text-[#4B4B4B] antialiased min-h-screen selection:bg-[#58CC02] selection:text-white">
    <div id="root">

        <div style="font-size: 48px; margin-bottom: 12px; animation: bounce 1s infinite alternate;">🦉</div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.indexOf('読み込み中') !== -1) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:sans-serif;text-align:center;">' +

            '<div style="font-size:36px;margin-bottom:8px;">⚠️</div>' +
            '<div style="font-weight:900;color:#FF4B4B;margin-bottom:8px;">読み込みに失敗しました</div>' +
            '<div style="font-size:12px;color:#777;margin-bottom:16px;">ブラウザのキャッシュをクリアして再読み込みしてください。</div>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="padding:10px 20px;background:#58CC02;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;">キャッシュクリアして再起動</button>' +
            '</div></div>';
        }
      });
    </script>
